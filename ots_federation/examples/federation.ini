# Federation Configuration for OTS Federation Plugin
# This file configures TAK federation v2 (gRPC mTLS peer-to-peer federation).
# See README.qmd for certificate generation and BYO-CA requirements.
# REQUIRED: OTS_FEDERATION_CONFIG in config.yml must point to this file.
# Three sections:
#   [federation]          — global switch, server identity, inbound listener
#                           default group policy, and CoreConfig parity knobs
#   [federation_ssl]      — CA bundle, server certificate, and private key paths
#   [federate:<name>]     — one entry per remote peer (repeat as needed)
# CoreConfig XML equivalent is noted as: → XMLAttrName
# Keys marked REQUIRED raise ConfigError or configparser.Error if absent.

# ===========================================================================
# [federation] — Global section
# ===========================================================================
# REQUIRED for federation to be active.
# If this section is absent or enabled = false, federation is disabled.
[federation]

# enabled: global switch. Set to false to disable without removing the config.
#   → (no CoreConfig equivalent; ots-federation plugin-level control)
#   Default: true when section exists.
enabled = true

# server_id: stable, unique identifier for THIS server's FederateProvenance.
#   → serverName (CoreConfig uses serverName for both identity label and ID)
#   REQUIRED. Use hostname or UUID. Never reuse the same ID across servers.
server_id = ots-primary-01

# server_name: human-readable label for this server (used in Identity.name).
#   → serverName
#   Default: value of server_id.
# server_name = OTS Primary Server

# max_hops: global default hop limit for forwarded events. -1 = unlimited.
#   → maxHops (CoreConfig per-peer; this is the taky-fed global default)
#   Default: 3
# max_hops = 3

# ---------------------------------------------------------------------------
# Inbound listener — enables this server to ACCEPT incoming federation dials
# from remote peers (taky-to-taky inbound gRPC server). Disabled by default
# so existing outbound-only deployments are unaffected.
# ---------------------------------------------------------------------------
# listen_enabled: set to true to start the inbound FederatedChannel gRPC server.
#   Default: false
# listen_enabled = false

# listen_ip: bind address for the inbound server.
#   Default: 0.0.0.0 (all interfaces)
# listen_ip = 0.0.0.0

# listen_port: bind port for the inbound server.
#   Default: 9101  (9100 is the outbound dial default; distinct to avoid clash)
# listen_port = 9101

# ---------------------------------------------------------------------------
# Default group policy — applied to any peer that has no per-peer accept_as /
# share_as configured. Empty string (default) = block (conservative default).
# Syntax: "REMOTE_GROUP:LOCAL_GROUP, *:" — comma-separated pair list.
# accept_as and share_as are the preferred aliases;
# default_group_map_in / default_group_map_out are the legacy names.
# ---------------------------------------------------------------------------
# accept_as: inbound group policy default. Controls WHAT WE LET IN and what
#   local Teams group inbound events are flagged as.
#   → federatedGroupMapping / group_map_in (inbound)
#   Example: accept_as = *:Cyan  (admit all remote groups as local Cyan)
#   Default: "" (block all inbound from unmapped peers)
# accept_as =

# share_as: outbound group policy default. Controls WHAT WE SHARE and what
#   group tag outbound events carry.
#   → federatedGroupMapping / group_map_out (outbound)
#   Example: share_as = White:White  (share only local White, tag as White)
#   Default: "" (block all outbound to unmapped peers)
# share_as =

# ---------------------------------------------------------------------------
# CoreConfig parity knobs — all optional; defaults match CoreConfig spec.
#.
# ---------------------------------------------------------------------------
# allow_federated_delete: permit remote delete (t-x-d-d) to propagate.
#   → allowFederatedDelete
#   Default: true (set false to harden against remote-deletion attacks)
# allow_federated_delete = true

# allow_mission_federation: enable mission data federation between peers.
#   → allowMissionFederation
#   Default: true
# allow_mission_federation = true

# allow_data_feed_federation: enable data feed federation between peers.
#   → allowDataFeedFederation
#   Default: true
# allow_data_feed_federation = true

# enable_mission_fed_disruption_tolerance: re-sync missions after reconnect.
#   → enableMissionFederationDisruptionTolerance
#   Default: false
# enable_mission_fed_disruption_tolerance = false

# mission_fed_disruption_tolerance_recency_secs: lookback window for re-sync.
#   → missionFederationDisruptionToleranceRecencySeconds
#   Default: 43200 (12 hours)
# mission_fed_disruption_tolerance_recency_secs = 43200

# federate_only_public_missions: restrict mission federation to public missions.
#   → federateOnlyPublicMissions
#   Default: false
# federate_only_public_missions = false

# enable_data_pkg_file_filter: filter data packages and mission files.
#   → enableDataPackageAndMissionFileFilter
#   Default: false
# enable_data_pkg_file_filter = false

# allow_duplicate: allow duplicate events to be forwarded.
#   → allowDuplicate
#   Default: false
# allow_duplicate = false

# initialization_delay_secs: seconds to wait before starting peer connections.
#   → initializationDelaySeconds
#   Default: 30
# initialization_delay_secs = 30

# max_message_size_bytes: maximum gRPC message size (bytes).
#   → maxMessageSizeBytes
#   Default: 268435456 (256 MiB)
# max_message_size_bytes = 268435456

# rol_log_sink: filesystem path to write raw ROL frame bytes (4-byte length
#   prefix + proto body per append). Empty = log only, no file sink.
#   → (no CoreConfig equivalent; taky-fed diagnostic feature)
# rol_log_sink =

# inject_cot_parser: Option D inbound delivery mode.
#   False (default): inbound federated events publish ONLY to the OTS 'groups'
#     topic exchange — SSL-grouped EUDs receive the event; __ANON__ does NOT.
#     Clean delivery, no over-share.
#   True: ALSO publish to cot_parser for OTS DB persistence; accepts the
#     __ANON__ side-delivery that cot_parser.route_cot causes with user_id=None.
#   → (no CoreConfig equivalent; ots-federation Option D flag)
#   Default: false
# inject_cot_parser = false


# ===========================================================================
# [federation_ssl] — Global TLS identity and trust anchor
# ===========================================================================
# fed_cert / fed_key double as the inbound server's identity when
# listen_enabled = true.  fed_ca_bundle is the client-cert verification root
# for both outbound (verify remote peer) and inbound mTLS.
[federation_ssl]

# fed_ca_bundle: path to the federation CA certificate (public cert, PEM).
#   All peers' certificates must be issued by (or chain to) this CA.
#   Generate with: ots-fed-certs --out-dir /etc/opentakserver/federation
#   → truststoreFile (CoreConfig <tls>)
#   Mode: 0644. REQUIRED.
fed_ca_bundle = /etc/opentakserver/federation/fed-ca.crt

# fed_cert: path to this server's certificate chain (leaf + CA, 2-cert PEM).
#   TAK Server FIG negotiator requires the full 2-cert chain; sending only
#   the leaf causes java.lang.NullPointerException on the TAK Server side.
#   Generate with: ots-fed-certs → use server-chain.crt output file.
#   → keystoreFile (CoreConfig <tls>)
#   Mode: 0644. REQUIRED.
fed_cert = /etc/opentakserver/federation/server-chain.crt

# fed_key: path to this server's private key (PKCS#8 or TraditionalOpenSSL).
#   → keystoreFile (same key pair as fed_cert)
#   Mode: 0600. REQUIRED.
fed_key = /etc/opentakserver/federation/server.key

# fed_key_pw: password protecting fed_key. Leave blank if key is unencrypted.
#   → keystorePass (CoreConfig <tls>)
#   Default: "" (unencrypted). OPTIONAL.
fed_key_pw =

# fed_verify_hostname: verify that the remote peer's cert CN/SAN matches the
#   configured address. Set false only in controlled lab environments.
#   Default: true
# fed_verify_hostname = true


# ===========================================================================
# [federate:tak-server-east] — Full example peer with group mappings
# ===========================================================================
# Shows all available knobs. Uncomment the optional lines you need.
[federate:tak-server-east]

# address: hostname or IP of the remote federation server.
#   Used for gRPC dial AND TLS SAN/CN validation (must match remote cert).
#   → address (CoreConfig <federate>)
#   REQUIRED.
address = tak-server-east.example.com

# display_name: human-readable name shown in federation UI and logs.
#   → displayName (CoreConfig <federate>)
#   REQUIRED.
display_name = TAK Server East

# enabled: set to false to temporarily disable this peer without deleting it.
#   Default: true
# enabled = true

# port: TCP port on the remote federation server.
#   → port (CoreConfig <federate>)
#   Default: 9100 (gRPC v2). TAK Server typically listens on 9100.
# port = 9100

# protocol: transport protocol. "grpc" (v2, default) or "v1fig" (legacy v1).
#   Only "grpc" is implemented in Phase 1 of taky-fed.
#   Default: grpc
# protocol = grpc

# protocol_version: federation protocol version (2 = current gRPC FIG spec).
#   → protocolVersion (CoreConfig <federate>)
#   Default: 2
# protocol_version = 2

# max_hops: per-peer hop limit override. -1 = unlimited. Overrides [federation]
#   max_hops for this peer only.
#   → maxHops (CoreConfig <federate>)
#   Default: -1
# max_hops = -1

# ---------------------------------------------------------------------------
# Group mappings — accept_as / share_as (preferred) or group_map_in /
# group_map_out (legacy aliases). When both are present, the preferred key
# wins and a warning is logged.
# Format:
#   accept_as = REMOTE_GROUP:LOCAL_GROUP, REMOTE2:LOCAL2, *:LOCAL_CATCH_ALL
#   share_as  = LOCAL_GROUP:REMOTE_GROUP, LOCAL2:REMOTE2
# The '*' wildcard on the LHS matches any group not listed earlier.
# An empty RHS (e.g., "*:") BLOCKS the matched group — no local admission.
# CoreConfig equivalents:
#   accept_as  → inboundGroupMapping  (maps remote Teams → local Teams)
#   share_as   → outboundGroupMapping (maps local Teams → remote Teams)
# ---------------------------------------------------------------------------
# accept_as: admit events from this peer into local group(s).
#   Example below: map remote "White" to local "White", block everything else.
#   → inboundGroupMapping (CoreConfig <federate>)
#   Default: "*:" (accept all groups from peer, strip group tag on inbound)
accept_as = White:White, *:

# share_as: share local events with this peer under remote group tag(s).
#   Example below: share only local "White" group events as remote "White".
#   Unlisted local groups are NOT shared.
#   → outboundGroupMapping (CoreConfig <federate>)
#   Default: "*:*" (share all groups as-is)
share_as = White:White

# ---------------------------------------------------------------------------
# Per-peer TLS overrides — leave blank to use [federation_ssl] globals.
# ---------------------------------------------------------------------------
# ca_cert: per-peer CA cert for verifying THIS peer's certificate only.
#   Useful in multi-CA scenarios. Blank = use fed_ca_bundle.
#   → (per-peer CA pinning, no CoreConfig equivalent)
# ca_cert =

# client_cert: per-peer client certificate chain (leaf + CA, 2-cert PEM).
#   Blank = use fed_cert. Useful when each peer requires a unique identity.
# client_cert =

# client_key: private key matching client_cert. Mode: 0600.
#   Blank = use fed_key.
# client_key =

# ---------------------------------------------------------------------------
# Connection management
# ---------------------------------------------------------------------------
# reconnect_interval: base seconds between reconnect attempts (exponential
#   back-off caps at 300s / 5 minutes).
#   Default: 30
# reconnect_interval = 30

# health_check_interval: seconds between HealthCheck RPCs.
#   Default: 10
# health_check_interval = 10

# max_retries: maximum reconnect attempts. -1 = unlimited.
#   → maxRetries (CoreConfig <federate>)
#   Default: -1
# max_retries = -1

# unlimited_retries: when true, ignore max_retries and retry indefinitely.
#   → unlimitedRetries (CoreConfig <federate>)
#   Default: true
# unlimited_retries = true

# fallback: secondary address to try if primary (address) is unreachable.
#   → fallback (CoreConfig <federate>)
#   Default: None (no fallback)
# fallback =

# ---------------------------------------------------------------------------
# CoreConfig parity knobs — per-peer overrides
# ---------------------------------------------------------------------------
# share_alerts: forward alert CoT events (a-*-A-*) to this peer.
#   → shareAlerts (CoreConfig <federate>)
#   Default: true
# share_alerts = true

# archive: enable archiving of federated events for this peer.
#   → archive (CoreConfig <federate>)
#   Default: true
# archive = true

# federated_group_mapping: enable group-level filtering for this peer.
#   → federatedGroupMapping (CoreConfig <federate>)
#   Default: true
# federated_group_mapping = true

# automatic_group_mapping: automatically create group mappings at connect time.
#   → automaticGroupMapping (CoreConfig <federate>)
#   Default: false
# automatic_group_mapping = false

# use_group_hop_limiting: enforce per-group hop limits for this peer.
#   → useGroupHopLimiting (CoreConfig <federate>)
#   Default: false
# use_group_hop_limiting = false

# fallback_when_no_group_mappings: admit all groups if no mapping is configured.
#   → fallbackWhenNoGroupMappings (CoreConfig <federate>)
#   Default: false
# fallback_when_no_group_mappings = false

# use_token: require a connection token for this peer.
#   → useToken (CoreConfig <federate>)
#   Default: false
# use_token = false

# connection_token: shared secret token for token-based peer authentication.
#   → connectionToken (CoreConfig <federate>)
#   SECRET — never commit to version control. Leave absent if use_token=false.
# connection_token =

# token_type: token type identifier (e.g., "bearer").
#   → tokenType (CoreConfig <federate>)
# token_type =

# token_federate: enable token-based federation mode for this peer.
#   → tokenFederate (CoreConfig <federate>)
#   Default: false
# token_federate = false

# token_expiration: token expiry in seconds. 0 / absent = no expiry.
#   → tokenExpiration (CoreConfig <federate>)
# token_expiration =

# inbound_group_mapping: additional inbound group mapping string.
#   → inboundGroupMapping (CoreConfig <federate>)
# inbound_group_mapping =

# mission_federate_default: federate missions by default for this peer.
#   → missionFederateDefault (CoreConfig <federate>)
#   Default: true
# mission_federate_default = true

# filter: CoT XPath/event-type expression to filter events for this peer.
#   → filter (CoreConfig <federate>)
#   Example: filter = //event[@type='a-f-type']
# filter =

# max_frame_size: maximum gRPC frame size in bytes for this peer.
#   → maxFrameSize (CoreConfig <federate>)
#   Default: None (use gRPC default)
# max_frame_size =

# notes: operator notes about this peer (stored but not transmitted).
#   → notes (CoreConfig <federate>)
# notes =


# ===========================================================================
# [federate:taky-peer-minimal] — Minimal required-fields-only example
# ===========================================================================
# Only address and display_name are required. All other keys use defaults:
#   port=9100, protocol=grpc, accept_as="*:" (allow all, strip group)
#   share_as="*:*" (share all groups), reconnect_interval=30, etc.
[federate:taky-peer-minimal]
address = taky-peer.example.com
display_name = Taky Peer Minimal


# ###########################################################################
# TOPOLOGY PATTERNS — copy the block that matches your intent
# ###########################################################################
#
# "Passthrough" (a.k.a. transit / hub) = whether events RECEIVED from one
# federation peer are RE-FEDERATED out to your OTHER peers. It is controlled by
# ONE knob, [federation] inject_cot_parser, plus max_hops to bound loops:
#
#   inject_cot_parser = false (default)
#       Inbound federated events are delivered to your LOCAL clients only (via
#       the OTS groups exchange). They never re-enter the outbound fan-out, so
#       peer A's traffic does NOT reach peer B through you. NO passthrough.
#
#   inject_cot_parser = true
#       Inbound federated events are ALSO published to cot_parser, re-enter the
#       firehose, and fan out to your other peers (loop-filtered + hop-bounded).
#       You become a relay hub between peers. PASSTHROUGH ON.
#
# accept_as / share_as still govern WHAT crosses each link in each direction;
# the pattern blocks below set them for full bidirectional exchange.
#
# ---------------------------------------------------------------------------
# PATTERN 1 — Allow ALL: inbound + outbound + PASSTHROUGH (full transit hub)
# ---------------------------------------------------------------------------
# Every peer exchanges with you AND their traffic relays to your other peers.
# Use for a central hub knitting multiple servers into one shared picture.
# max_hops MUST be finite (not -1) so relayed events cannot loop forever.
#
#   [federation]
#   enabled = true
#   server_id = OTS-HUB
#   max_hops = 3                     # finite — bounds transit loops
#   listen_enabled = true           # accept inbound dials
#   accept_as = *:__ANON__          # accept every remote group
#   share_as  = *:*                 # share every local group outbound
#   inject_cot_parser = true        # <-- PASSTHROUGH ON (relay between peers)
#
#   # then one [federate:*] per peer with per-peer accept_as/share_as as needed
#
# ---------------------------------------------------------------------------
# PATTERN 2 — Allow inbound + outbound with BOTH peers, but NO passthrough
# ---------------------------------------------------------------------------
# Each peer sends to you and receives your LOCAL events, but peer A's traffic
# is NOT relayed to peer B (and vice-versa). You are a spoke endpoint, not a
# hub. This is the safe default for keeping peer domains isolated.
#
#   [federation]
#   enabled = true
#   server_id = OTS-SPOKE
#   max_hops = 3
#   listen_enabled = true           # accept inbound dials
#   accept_as = *:__ANON__          # accept every remote group (inbound)
#   share_as  = *:*                 # share every LOCAL group outbound
#   inject_cot_parser = false       # <-- PASSTHROUGH OFF (default): no relay
#
#   # Bidirectional with each peer = list every peer as a [federate:*] with
#   # enabled=true. Because inject_cot_parser=false, only YOUR local client
#   # events reach them — never events you received from another peer.
